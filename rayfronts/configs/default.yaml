defaults:
  - _self_
  - dataset: "niceslam_replica"
  - mapping: "semantic_voxel_map"
  - encoder: "radseg"
  - depth_estimator: null
  - vis: "rerun" # Set to null to disable
  - messaging_service: null # Set to null to disable
  - feat_compressor: null # Set to null to disable
  - extras

# Disable logging to files
hydra:
  output_subdir: null
  run:
    dir: .

# How many frames should be batched before processing.
batch_size: 1

# Decoupled geometry/semantics pipeline: geometry is built directly from point
# cloud scans (dataset must yield tagged scan/frame items, e.g. StarlingMax
# decoupled_mode) while semantic features are attached from RGB keyframes.
decoupled_pipeline: False

# In the decoupled pipeline, run the encoder + semantic fusion on every Nth
# synced RGB/pose frame.
semantic_keyframe_period: 5

# Exploration planner (python3 -m rayfronts.exploration_planner). Launching it
# also launches the mapping process; the planner runs on a background thread.
exploration:
  # Frontier selection cost = distance_weight * distance
  # + heading_weight * |heading change to face the frontier| (radians).
  distance_weight: 1.0   # a
  heading_weight: 1.0    # b
  # Which mapper frontier tensor to explore: class_frontiers (default),
  # frontiers (geometric), or semantic_coverage_frontiers.
  frontier_source: class_frontiers
  # Exploration pose: hover_height (h) metres above a selected-class voxel...
  hover_height: 1.2
  # ...with a fully known-empty sphere of safety_radius (r) around it
  # (unobserved space counts as unsafe unless safety_allow_unknown)...
  safety_radius: 0.6
  # Accept unobserved voxels inside the safety sphere (only observed-occupied
  # rejects a candidate). Matches the LOS check's treatment of unknown space;
  # goals may then sit in never-scanned air, so the goal follower's local
  # avoidance must be trusted to handle surprises there.
  safety_allow_unknown: False
  # ...within this horizontal standoff range of the frontier, with an
  # occlusion-free line of sight to it.
  view_min_dist: 0.8
  view_max_dist: 8.0
  # The frontier must sit within the camera's viewable elevation band:
  # |depression angle - view_pitch_deg| <= view_max_elevation_deg, where
  # view_pitch_deg is the camera pitch below the horizon (0 = level) and
  # view_max_elevation_deg ~ half the vertical FOV. Set to null to derive it
  # from the camera intrinsics (atan((H/2)/fy)). Note this implies a minimum
  # standoff of hover_height / tan(pitch + max_elevation).
  view_pitch_deg: 0.0
  view_max_elevation_deg: null
  # Inflate the viewable elevation band by this factor (>1 pretends a wider
  # vertical FOV, admitting closer viewpoints; the frontier may then fall
  # slightly outside the actual image).
  view_fov_scale: 1.0
  # Only class voxels within this radius of the frontier are considered as
  # anchor candidates.
  candidate_search_radius: 6.0
  # Viewpoint ranking: cost = distance_to_robot + frontier_proximity_weight
  # * horizontal_standoff_to_frontier. 0 = pick whatever is cheapest to
  # reach (drone observes from afar and barely advances); >0 pushes goals
  # toward the frontier (bounded below by the elevation-band min standoff),
  # so reaching a goal actively expands the mapped area.
  frontier_proximity_weight: 0.0
  # Cap on candidates checked per frontier and frontiers tried per cycle
  # (failed frontiers are blacklisted/removed). When more candidates exist,
  # the nearest half is kept plus a uniform random spread of the rest.
  max_candidates: 512
  max_attempts_per_cycle: 10
  # Failed frontiers are banned with exponential backoff instead of forever:
  # ban = blacklist_base_ban_s * 2^(fails-1), capped at blacklist_max_ban_s.
  # The fail count persists across expiries, so hopeless frontiers are
  # retried progressively less often; a goal reported FAILED counts as two
  # failures. Rechecks matter because "no safe viewpoint" depends on map
  # state, which improves as space is carved/labeled.
  blacklist_base_ban_s: 15.0
  blacklist_max_ban_s: 240.0
  # Region-based hierarchical exploration (MAIPP-style). The semantically
  # unexplored space inside the xy bounds — info-grid cells (grid_cell_size)
  # with no ground/obstacle classification yet — is segmented into
  # 8-connected components (above region_max_area_m2 median-split; below
  # region_min_area_m2 dropped). The planner commits to the nearest region:
  # while it holds < region_min_frontiers active frontiers, goals chase the
  # frontier closest to the region centroid (approach); once frontiers
  # appear inside, only those are explored (cover). A region completes when
  # the classified fraction of its cells reaches region_coverage_done or
  # region_time_budget_s elapses; completed regions are excluded from
  # re-selection for region_retire_cooldown_s. When no unknown regions
  # remain, behavior falls back to global frontier ranking. Requires the xy
  # bounds to be set.
  region_mode: False
  region_min_area_m2: 1.0
  region_max_area_m2: 25.0
  # Approach->cover switch: frontiers inside the region needed to count it
  # as "in view" and restrict exploration to it.
  region_min_frontiers: 1
  # Completion: classified fraction of the region's cells at which it is
  # considered covered.
  region_coverage_done: 0.85
  region_time_budget_s: 180.0
  region_retire_cooldown_s: 180.0
  # ---- Task selection (MAIPP-greedy): with region_mode on, the planner
  # commits to ONE task at a time, chosen as the argmax utility over
  # explore-region candidates and person-track revisit candidates:
  #   region: task_w_mass * lambda_sum + task_w_prob * (1-exp(-lambda_sum))
  #           - task_w_travel * dist,   lambda_sum = target_birth_density *
  #           unexplored m^2 (v1: uniform undetected-person birth prior)
  #   track:  task_w_exist * existence + task_w_cov * trace(P)
  #           + task_w_stale * secs_since_seen - task_w_travel * dist
  # Tracks are candidates only when existence >= track_task_min_existence,
  # position sigma >= track_task_min_sigma (uncertainty actually grew), AND
  # the person has been unseen for track_task_min_unseen_s — the empirical
  # re-observation cadence; exploration always wins until then. A track
  # task flies to a viewpoint of the track mean and completes on
  # re-acquisition (covariance collapsed below track_task_min_sigma), track
  # removal, or track_task_time_budget_s.
  target_birth_density: 0.01
  task_w_mass: 1.0
  task_w_prob: 0.5
  task_w_exist: 1.0
  task_w_cov: 0.2
  task_w_stale: 0.005
  task_w_travel: 0.05
  track_task_min_existence: 0.3
  track_task_min_sigma: 0.8
  track_task_min_unseen_s: 240.0
  track_task_time_budget_s: 60.0
  # ---- Multi-robot MAIPP comms. With robot_id > 0, the planner publishes
  # under /robot_<robot_id>/maipp (all in frontier-frame coordinates):
  #   coverage_grid  nav_msgs/OccupancyGrid  (-1 unknown / 0 ground /
  #                  100 obstacle, resolution = grid_cell_size)
  #   tracks         vision_msgs/Detection3DArray (id "<rid>:<tid>",
  #                  score = existence, pose + xy covariance,
  #                  per-detection stamp = last seen; assumes synced clocks)
  #   task_claim     geometry_msgs/PolygonStamped (region bbox, a single
  #                  point at a claimed track, or empty when idle)
  # and subscribes to the same topics of every peer_robot_ids entry. Fusion:
  # peer-classified cells stop being unexplored (regions never target them);
  # peer tracks merge into local ones by Mahalanobis gating (peer mean/cov
  # adopted when more certain, existence/last-seen take the max) or are
  # imported as new tracks; fresh peer claims (younger than claim_ttl_s)
  # exclude their region cells / claimed track from our task selection.
  # robot_id 0 disables comms. Convention: high-flyer = 1, starlings 2+.
  robot_id: 0
  peer_robot_ids: []
  comms_publish_period_s: 3.0
  claim_ttl_s: 10.0
  # People detection (vision_msgs/Detection2DArray; null disables). The
  # bottom-center of each person bbox — where the person stands — is
  # undistorted with the RGB calibration, cast through the camera pose at
  # the detection stamp (rgb_stamp_offset applies), and intersected with the
  # ground plane at the median ground-class voxel height. Detections within
  # person_merge_radius of a tracked person update it (position EMA);
  # farther ones create a new person. Projections whose ray is near the
  # horizon or lands beyond detection_max_range are dropped as unreliable,
  # as are detections without a pose within detection_max_pose_dt. Tracked
  # people are drawn on the exploration/people rerun layer.
  detection_topic: null
  person_class_id: person
  person_min_score: 0.5
  person_merge_radius: 1.0
  detection_max_range: 12.0
  detection_max_pose_dt: 0.5
  # People are Bernoulli-Kalman tracks (MAIPP-compatible): a stable track_id,
  # a position mean, a 2x2 horizontal covariance P, and an existence
  # probability r.
  # - Association: a projected detection matches the track with the smallest
  #   Mahalanobis distance within person_gate_chi2 (chi-square, 2 dof; 9.21
  #   = 99%), with person_merge_radius as a plain euclidean floor. Stale
  #   tracks have grown P, so their gate widens naturally.
  # - Update: Kalman update with measurement sigma = person_meas_noise_base
  #   + person_meas_noise_per_m * range (far/grazing projections trusted
  #   less); existence rises as r <- 1-(1-r)(1-p_d).
  # - Negative evidence: a track the camera should see (visible down to
  #   lying height, in-frame, in-range, unoccluded; rate-limited to one per
  #   person_negative_min_interval_s of message time) but no detection
  #   matched lowers existence as r <- r(1-p_d)/(1-r*p_d) with p_d =
  #   person_p_detect; r < person_exist_remove deletes the track. Requires
  #   the detector to publish (possibly empty) Detection2DArray messages for
  #   every processed frame.
  # - Covariance grows by person_process_noise (m^2/s) while unobserved, so
  #   P quantifies where/how-hard to look when revisiting (task selection).
  person_p_detect: 0.6
  person_exist_remove: 0.2
  person_exist_confirm: 0.8
  person_process_noise: 0.02
  person_meas_noise_base: 0.3
  person_meas_noise_per_m: 0.05
  person_gate_chi2: 9.21
  person_negative_min_interval_s: 0.5
  # Seconds between planning cycles.
  plan_period: 2.0
  # Goal output: bare geometry_msgs/Pose in the pose-topic world frame
  # (PX4 NED map — same frame as the odometry topic).
  goal_topic: /goal_point
  # Goal feedback (std_msgs/Int8: 0 = in_progress, 1 = reached, 2 = failed).
  # A new goal is published only when the outstanding one is reported
  # reached or failed; status messages received earlier than
  # status_min_delay seconds after the goal was published are ignored as
  # stale feedback about the previous goal. A FAILED goal blacklists its
  # frontier.
  goal_status_topic: /goal_reach_status
  status_min_delay: 0.3
  # External enable switch for goal publishing (std_msgs/Int8: 1 = allow,
  # 0 = suppress). Only gates goal_topic output; mapping, visualization and
  # goal feedback handling continue as usual. Publishing is allowed until a
  # 0 is received.
  goal_publish_allow_topic: /goal_publish_allow
  # 2D information grid (unknown / non-obstacle / obstacle + confidence),
  # built per keyframe from the visible voxels: chosen-class voxels with no
  # other-class voxel beneath them (global-map check) mark non-obstacle;
  # other-class voxels within obstacle_max_height_voxels above a chosen-class
  # voxel mark obstacle. Obstacle wins cell conflicts.
  grid_cell_size: 0.2
  obstacle_max_height_voxels: 10
  # A cell is an obstacle iff it has at least one obstacle vote AND
  # obstacle_votes / total_votes >= obstacle_min_frac (votes are per voxel,
  # accumulated across keyframes; cell confidence = the winning fraction).
  # 0.0 = a single obstacle vote dominates (maximally conservative); raise
  # (e.g. 0.2-0.4) so isolated misclassified voxels cannot poison a cell —
  # mainly useful when grid_cell_size > vox_size.
  obstacle_min_frac: 0.0
  # Height (world RDF y) at which the info grid layer is rendered in rerun.
  # null = median stored ground height across cells. Display only.
  grid_vis_height: null
  # Shared frontier-mapping frame for multi-robot operation. When
  # ff_origin_lat is set (together with the ned_origin_* georeference), all
  # planar bookkeeping — info-grid cell keys, region segmentation, bounds —
  # happens in the mission-level global frame used by the high-flying drone:
  # ENU at (ff_origin_lat, ff_origin_lon) with X rotated ff_heading_deg CCW
  # from East. Map cells then align across robots. Bounds come from
  # ff_map_min/max_x/y (in the frontier frame) and REPLACE xmin/xmax/ymin/
  # ymax. Goal publishing stays in the local pose-topic frame.
  ff_origin_lat: null
  ff_origin_lon: null
  ff_origin_alt: 0.0
  ff_heading_deg: 0.0
  ff_map_min_x: null
  ff_map_max_x: null
  ff_map_min_y: null
  ff_map_max_y: null
  # Georeference of the local NED odometry frame: global position of the
  # local-frame origin and the compass azimuth (degrees clockwise from TRUE
  # north) of the local NED +x axis — i.e. the drone's heading when odometry
  # initialized. Required whenever ff_origin_lat is set.
  ned_origin_lat: null
  ned_origin_lon: null
  ned_origin_alt: 0.0
  ned_heading_deg: 0.0
  # Exploration xy bounds, in the POSE-TOPIC world frame (e.g. PX4 NED map:
  # x north-ish, y east-ish — the same frame goals are published in). Outside
  # [xmin, xmax] x [ymin, ymax]: class-specific frontiers are not generated
  # and the 2D info grid takes no votes. null = unbounded. Ignored when a
  # frontier frame is configured (ff_map_* applies instead). Applied when
  # running the exploration planner entry point.
  xmin: null
  xmax: null
  ymin: null
  ymax: null

# Imposing a depth limit on the data such that to test limited depth scenarios
# Set to a negative number to not use a limit
depth_limit: -1

# Which pytorch interpolation mode for rgb and feature interpolation 
# (Depth and Segmentation always use nearest-exact)
interp_mode: bilinear

querying:

  # If not set to null then text querying is enabled. If query is set to `prompts` 
  # then every line from the query file is considered as a prompt. If set to 
  # labels then every line will be considered as a label that will be injected 
  # into multiple prompt templates and averaged out to get the text embedding.
  text_query_mode: null # [null, "labels", "prompts"]

  # Whether to query in compressed feature space or decompress first. Only used
  # if feat_compressor was used.
  compressed: False

  # A query file used to initialize the list of queries will be used to query
  # the map periodically and visualizing the results.
  # The query file can be a .txt or .json file.
  # .txt: each line represents a query. If the query is a locally existing file
  # name, then it attempts to load that file as an image query. If no file 
  # exists, the query is assumed to be a text query.
  # .json: A dictionary where the query is the key and the value is a hex
  # color such that the query is colorized using that in the visualization.
  query_file: null

  # Whether softmax probability is computed across queries or not.
  # If you want results to be independent of other queries set this to false.
  # Image queries are seperated from text queries. i.e the softmax is computed
  # separately for the text query group and the image query group.
  compute_prob: True

  # How often should the mapping server update query results in the map.
  period: 10

# How often the messaging service publishes map point clouds (e.g. frontiers).
messaging_publish_period: 10

# Whether to use torch.compile as much as possible. Improves speed 
# but may increase VRAM usage.
compile: True
# Whether to use automatic mixed percision as much as possible.
amp: True

seed: 17
