defaults:
  - _self_
  - dataset: "niceslam_replica"
  - mapping: "semantic_voxel_map"
  - encoder: "radseg"
  - depth_estimator: null
  - vis: "rerun" # Set to null to disable
  - messaging_service: null # Set to null to disable
  - feat_compressor: null # Set to null to disable
  - extras

# Disable logging to files
hydra:
  output_subdir: null
  run:
    dir: .

# How many frames should be batched before processing.
batch_size: 1

# Decoupled geometry/semantics pipeline: geometry is built directly from point
# cloud scans (dataset must yield tagged scan/frame items, e.g. StarlingMax
# decoupled_mode) while semantic features are attached from RGB keyframes.
decoupled_pipeline: False

# In the decoupled pipeline, run the encoder + semantic fusion on every Nth
# synced RGB/pose frame.
semantic_keyframe_period: 5

# Exploration planner (python3 -m rayfronts.exploration_planner). Launching it
# also launches the mapping process; the planner runs on a background thread.
exploration:
  # Frontier selection cost = distance_weight * distance
  # + heading_weight * |heading change to face the frontier| (radians).
  distance_weight: 1.0   # a
  heading_weight: 1.0    # b
  # Which mapper frontier tensor to explore: class_frontiers (default),
  # frontiers (geometric), or semantic_coverage_frontiers.
  frontier_source: class_frontiers
  # Exploration pose: hover_height (h) metres above a selected-class voxel...
  hover_height: 1.2
  # ...with a fully known-empty sphere of safety_radius (r) around it
  # (unobserved space counts as unsafe)...
  safety_radius: 0.3
  # ...within this horizontal standoff range of the frontier, with an
  # occlusion-free line of sight to it.
  view_min_dist: 0.8
  view_max_dist: 8.0
  # The frontier must sit within the camera's viewable elevation band:
  # |depression angle - view_pitch_deg| <= view_max_elevation_deg, where
  # view_pitch_deg is the camera pitch below the horizon (0 = level) and
  # view_max_elevation_deg ~ half the vertical FOV. Set to null to derive it
  # from the camera intrinsics (atan((H/2)/fy)). Note this implies a minimum
  # standoff of hover_height / tan(pitch + max_elevation).
  view_pitch_deg: 0.0
  view_max_elevation_deg: null
  # Inflate the viewable elevation band by this factor (>1 pretends a wider
  # vertical FOV, admitting closer viewpoints; the frontier may then fall
  # slightly outside the actual image).
  view_fov_scale: 1.0
  # Only class voxels within this radius of the frontier are considered as
  # anchor candidates.
  candidate_search_radius: 6.0
  # Cap on candidates checked per frontier and frontiers tried per cycle
  # (failed frontiers are blacklisted/removed).
  max_candidates: 128
  max_attempts_per_cycle: 10
  # Seconds between planning cycles.
  plan_period: 2.0
  # Goal output: bare geometry_msgs/Pose in the pose-topic world frame
  # (PX4 NED map — same frame as the odometry topic).
  goal_topic: /goal_point
  # Goal feedback (std_msgs/Int8: 0 = in_progress, 1 = reached, 2 = failed).
  # A new goal is published only when the outstanding one is reported
  # reached or failed; status messages received earlier than
  # status_min_delay seconds after the goal was published are ignored as
  # stale feedback about the previous goal. A FAILED goal blacklists its
  # frontier.
  goal_status_topic: /goal_reach_status
  status_min_delay: 0.3
  # External enable switch for goal publishing (std_msgs/Int8: 1 = allow,
  # 0 = suppress). Only gates goal_topic output; mapping, visualization and
  # goal feedback handling continue as usual. Publishing is allowed until a
  # 0 is received.
  goal_publish_allow_topic: /goal_publish_allow
  # 2D information grid (unknown / non-obstacle / obstacle + confidence),
  # built per keyframe from the visible voxels: chosen-class voxels with no
  # other-class voxel beneath them (global-map check) mark non-obstacle;
  # other-class voxels within obstacle_max_height_voxels above a chosen-class
  # voxel mark obstacle. Obstacle wins cell conflicts.
  grid_cell_size: 0.2
  obstacle_max_height_voxels: 10
  # A cell is an obstacle iff it has at least one obstacle vote AND
  # obstacle_votes / total_votes >= obstacle_min_frac (votes are per voxel,
  # accumulated across keyframes; cell confidence = the winning fraction).
  # 0.0 = a single obstacle vote dominates (maximally conservative); raise
  # (e.g. 0.2-0.4) so isolated misclassified voxels cannot poison a cell —
  # mainly useful when grid_cell_size > vox_size.
  obstacle_min_frac: 0.0
  # Height (world RDF y) at which the info grid layer is rendered in rerun.
  # null = median stored ground height across cells. Display only.
  grid_vis_height: null
  # Exploration xy bounds, in the POSE-TOPIC world frame (e.g. PX4 NED map:
  # x north-ish, y east-ish — the same frame goals are published in). Outside
  # [xmin, xmax] x [ymin, ymax]: class-specific frontiers are not generated
  # and the 2D info grid takes no votes. null = unbounded. Applied when
  # running the exploration planner entry point.
  xmin: null
  xmax: null
  ymin: null
  ymax: null

# Imposing a depth limit on the data such that to test limited depth scenarios
# Set to a negative number to not use a limit
depth_limit: -1

# Which pytorch interpolation mode for rgb and feature interpolation 
# (Depth and Segmentation always use nearest-exact)
interp_mode: bilinear

querying:

  # If not set to null then text querying is enabled. If query is set to `prompts` 
  # then every line from the query file is considered as a prompt. If set to 
  # labels then every line will be considered as a label that will be injected 
  # into multiple prompt templates and averaged out to get the text embedding.
  text_query_mode: null # [null, "labels", "prompts"]

  # Whether to query in compressed feature space or decompress first. Only used
  # if feat_compressor was used.
  compressed: False

  # A query file used to initialize the list of queries will be used to query
  # the map periodically and visualizing the results.
  # The query file can be a .txt or .json file.
  # .txt: each line represents a query. If the query is a locally existing file
  # name, then it attempts to load that file as an image query. If no file 
  # exists, the query is assumed to be a text query.
  # .json: A dictionary where the query is the key and the value is a hex
  # color such that the query is colorized using that in the visualization.
  query_file: null

  # Whether softmax probability is computed across queries or not.
  # If you want results to be independent of other queries set this to false.
  # Image queries are seperated from text queries. i.e the softmax is computed
  # separately for the text query group and the image query group.
  compute_prob: True

  # How often should the mapping server update query results in the map.
  period: 10

# How often the messaging service publishes map point clouds (e.g. frontiers).
messaging_publish_period: 10

# Whether to use torch.compile as much as possible. Improves speed 
# but may increase VRAM usage.
compile: True
# Whether to use automatic mixed percision as much as possible.
amp: True

seed: 17
