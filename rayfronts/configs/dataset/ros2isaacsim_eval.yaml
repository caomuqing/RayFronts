# Configuration for ROS2 Isaac Sim dataset with semantic segmentation for evaluation
# This configuration subscribes to ROS2 topics from Isaac Sim robot simulation
# and is specifically designed for semantic segmentation evaluation
defaults:
  - base_dataset

_target_: rayfronts.datasets.ros.Ros2SemSegSubscriber

# ROS2 topics
rgb_topic: "/robot_1/sensors/front_stereo/left/image_rect"
pose_topic: "/robot_1/odometry_conversion/odometry"  # Adjust this topic name as needed
semseg_topic: "/robot_1/sensors/front_stereo/left/segmentation"
semantic_labels_topic: "/robot_1/sensors/front_stereo/semantic_labels"

# Depth source (choose one)
# disparity_topic: "/robot_1/sensors/front_stereo/disparity/disparity_image"
depth_topic: "/robot_1/sensors/front_stereo/left/depth"  # Adjust this topic name as needed

# Camera intrinsics
intrinsics_topic: "/robot_1/sensors/front_stereo/left/camera_info"  # Adjust this topic name as needed

# Coordinate system
src_coord_system: "flu"  # Forward-Left-Up (Isaac Sim default)

# Image resolution for evaluation (can be different from original)
rgb_resolution: [480, 640]  # Adjust based on your camera resolution
depth_resolution: [480, 640]

# Frame processing for evaluation
frame_skip: 10  # Process every frame for evaluation
interp_mode: "bilinear"

# Semantic segmentation
load_semseg: true
