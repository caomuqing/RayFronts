# Preset for Datasets/starlingmax_2026_06_24_160055.
#
# Usage:
#   ros2 bag play Datasets/starlingmax_2026_06_24_160055
#   python -m rayfronts.mapping_server --config-dir experiments/preset_configs --config-name starlingmax_bag
#
# Calibration files are provided under the bag's calibration/ directory. The
# intrinsics file is named intrinsics.txt but contains JSON and is read directly
# by json.load.

defaults:
  - default
  - override dataset: starlingmax
  - override encoder: radseg
  - override mapping: semantic_ray_frontiers_map
  - override vis: rerun
  - override messaging_service: ros

dataset:
  rgb_topic: "/hires_front_small_color"
  pose_topic: "/odom_px4_fused"
  pose_msg_type: "odometry"

  depth_topic: null
  depth_intrinsics_file: null
  point_cloud_topic: "/tof_pc"
  point_cloud_frame: "sensor"
  confidence_topic: null

  intrinsics_file: Datasets/starlingmax_2026_06_24_160055/calibration/intrinsics.txt
  extrinsics_conf_path: Datasets/starlingmax_2026_06_24_160055/calibration/extrinsics.conf
  rgb_frame_name: "hires_front"
  depth_frame_name: "tof"

  # VOXL/PX4 body frames are usually FRD. Change to "flu" if your odometry
  # topic has already been converted to the ROS body-frame convention.
  src_coord_system: "frd"
  extrinsics_coord_system: "frd"

  rgb_resolution: [480, 640]
  depth_resolution: [480, 640]
  frame_skip: 3
