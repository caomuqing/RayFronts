# Preset for ../Datasets/rosbag2_2026_07_01-23_52_59 using the DECOUPLED
# geometry/semantics pipeline.
#
# Geometry: every /registered_scan (world frame, superodom_map) is ingested
# directly as a point cloud — occupied voxels at the points, free space carved
# from the scan-time body position (looked up from /odom_px4_fused). No
# registered depth image is rendered.
# Semantics: every semantic_keyframe_period-th synced RGB/pose frame is
# encoded (RadSeg) and its features are attached to visible occupied voxels
# (z-buffer visibility test). Occupied-but-unlabeled voxels are published as
# "semantic_coverage_frontiers".
#
# Usage from the repository root:
#   ros2 bag play ../Datasets/rosbag2_2026_07_01-23_52_59 --loop
#   python3 -m rayfronts.mapping_server --config-dir experiments/preset_configs --config-name starlingmax_decoupled_bag

defaults:
  - default
  - override dataset: starlingmax
  - override encoder: radseg
  - override mapping: semantic_ray_frontiers_map
  - override vis: rerun
  - override messaging_service: ros

bag_dir: ../Datasets/rosbag2_2026_07_01-23_52_59
# Calibration is versioned in-repo (copied from the 2026-06-24 recording
# session; valid across bags as long as the sensor mounting is unchanged).
calibration_dir: experiments/calibration/starlingmax_2026_06_24_160055

decoupled_pipeline: true
semantic_keyframe_period: 5

dataset:
  rgb_topic: "/drone/image_raw"
  pose_topic: "/odom_laser_ned_relay"
  pose_msg_type: "odometry"

  depth_topic: null
  depth_intrinsics_file: null
  point_cloud_topic: "/registered_scan_relay"
  point_cloud_frame: "world"
  # Calibrated with scripts/calibrate_scan_transform.py on
  # rosbag2_ric_indoor_open (residual tilt 0.911deg, height -5.5cm of the
  # previous hand-derived value). NOTE: the superodom_map frame depends on
  # LiDAR-odometry initialization, so this is per-recording — re-run the
  # calibration script when switching bags.
  point_cloud_to_world_transform:
    [0.0024759, 0.0003681, 0.0158068, -0.1738514, 0.1754495, -0.6849878, 0.6854085] #calibrated on rosbag2_ric_indoor_open
    #[0.0, 0.0, 0.0, 0.1800308, -0.1800308, 0.6838047, -0.6838047]
  decoupled_mode: true
  # Map only within 10m of the scan origin: beyond that, registration error
  # approaches voxel size and far ground flickers.
  scan_max_range: -1
  # Discard the rear cone (+-60deg around backward) of each scan: behind the
  # camera, and already mapped when it was in front. Tune to taste.
  scan_rear_discard_deg: 60.0
  confidence_topic: null
  # sync_slop governs the RGB<->pose match only (scans are decoupled).
  sync_queue_size: 150
  sync_slop: 0.1
  # Per-bag clock-domain correction added to RGB stamps before time sync.
  # 0.0 = camera and odometry stamps share a clock. If sync starves, measure
  # the offset via the "RGB->pose stamp diff" log and set it here (e.g. an
  # earlier recording of /drone/image_raw needed -1052054.588).
  rgb_stamp_offset: 0.0

  intrinsics_file: ${calibration_dir}/intrinsics.txt
  extrinsics_conf_path: ${calibration_dir}/extrinsics.conf
  rgb_frame_name: "hires_front"
  depth_frame_name: "tof"

  src_coord_system: "frd"
  extrinsics_coord_system: "frd"

  rgb_resolution: [480, 640]
  depth_resolution: [480, 640]
  frame_skip: 0

mapping:
  occ_thickness: 2
  # Carving all ~20k rays per scan is heavy; subsample empty samples per scan.
  max_empty_pts_per_frame: 500000
  # Boundary frontiers of these classes vs unlabeled/unknown space (cyan
  # "class_frontiers" layer). Must be labels from the query file.
  class_frontier_classes: ["ground", "grass"]
  debug_log_period: 10
  vox_size: 0.3
  # Hysteresis on label deletion: erase a voxel's semantics only once it is
  # confidently empty (log-odds <= -3), not on the first transient carve.
  # Prevents scan jitter from stripping labels off a patch that immediately
  # gets re-observed as occupied-but-unlabeled, spawning spurious
  # class/coverage frontiers around it. (Empty passes are -1 each, capped at
  # -max_empty_cnt; an occupied hit is +7.)
  sem_pruning_thresh: -3
  # Second line of defense: voxels that do get pruned keep their labels in a
  # CPU cache for this long and are restored if re-occupied within the window.
  sem_label_cache_ttl: 600

querying:
  text_query_mode: labels
  query_file: experiments/indoor_semantic_queries.json
  compute_prob: True
  period: 10

exploration:
  # Goal viewpoints hover this high above the ground-class anchor voxel.
  # Note the coupled minimum view standoff: hover_height / tan(32.5deg *
  # view_fov_scale) — 1.2m -> ~1.9m standoff at true FOV.
  hover_height: 1.2
  # Never command goals below this altitude (meters above the odometry
  # origin, i.e. takeoff ground level): low-sitting ground anchor voxels
  # (0.3m quantization, lidar returns under grass) cannot drag goals down.
  goal_min_altitude: 1.0
  # Ceilings against misclassified high "ground"/"grass" (canopy, roofs,
  # walls) and scan outliers: ignore frontiers above 3m and never command
  # a goal above 4m. Without these the planner will happily fly to 13m to
  # observe a "ground" frontier at 12.6m (seen in the field).
  frontier_max_altitude: 1.5
  goal_max_altitude: 2.0
  # Each new goal must be at least this far from the current position.
  goal_min_move: 1.0
  # Elevation-band inflation factor. 1.0 = use the true camera FOV; raise
  # (e.g. 1.3) to admit closer viewpoints at the cost of the frontier
  # possibly falling slightly outside the actual image.
  view_fov_scale: 1.0
  # Goal viewpoints may sit in unobserved air (only observed-occupied voxels
  # reject); the onboard follower's local avoidance covers surprises.
  safety_allow_unknown: True
  # Push the frontier: strongly prefer viewpoints close to it (1m closer to
  # the frontier is worth 3m of extra travel), so goals sit near the
  # elevation-band minimum standoff (~1.3m) instead of wherever is cheap.
  frontier_proximity_weight: 3.0
  # Hierarchical region exploration: segment unknown space into subregions,
  # commit to the nearest, approach it, exhaust its frontiers, move on
  # (see default.yaml `region_*` for all knobs).
  region_mode: True
  # Project person detections to the ground and track them on the map
  # (see default.yaml `person_*`/`detection_*` for the knobs).
  detection_topic: /drone/detections
  person_merge_radius: 2.5
  # p_d = 0.7 makes a well-confirmed track (r ~ 0.99) survive ~5 rate-
  # limited misses (~2.5s of the camera clearly seeing the spot without a
  # detection) before existence drops below person_exist_remove; fresh
  # low-confidence tracks die faster.
  person_p_detect: 0.7
  # Multi-robot MAIPP comms (see default.yaml for the protocol). Defaults
  # for robot_2; run_mapping_exploration.sh overrides robot_id and
  # peer_robot_ids per robot on the command line (robot_3 gets [1, 2]).
  robot_id: 2
  peer_robot_ids: [1, 3]
  # Work the western part of the map first: any task with frame x <= -15
  # strictly precedes tasks outside that zone.
  task_priority_zone: [null, -15.0, null, null]
  # Low-flyer deconfliction: never commit to work within 5m of the other
  # low-flyer's claimed task; hold when everything left is that close.
  # NOTE 5m is a compromise: viewpoint overhang (~2m per robot beyond its
  # region) plus inter-robot georeference error (2-4m) can consume it, so
  # close encounters remain possible and the followers' local avoidance is
  # the real safety layer. Both robots fly at the SAME altitude; per-robot
  # bands remain available via `flight_levels` (see default.yaml) if field
  # runs show passes that are too close.
  task_separation_m: 5.0
  # The buffer applies between the low-flyers only: the high-flyer's
  # claims deconflict tasks (regular claim exclusion) but pose no
  # collision risk, so they don't trigger the 12m proximity hold.
  task_separation_exempt: [1]
  # 2D information grid (unknown / non-obstacle / obstacle + confidence),
  # built per keyframe from the visible voxels: chosen-class voxels with no
  # other-class voxel beneath them (global-map check) mark non-obstacle;
  # other-class voxels within obstacle_max_height_voxels above a chosen-class
  # voxel mark obstacle. Obstacle wins cell conflicts.
  grid_cell_size: 0.5
  obstacle_max_height_voxels: 10
  # A cell is an obstacle iff it has at least one obstacle vote AND
  # obstacle_votes / total_votes >= obstacle_min_frac (votes are per voxel,
  # accumulated across keyframes; cell confidence = the winning fraction).
  # 0.0 = a single obstacle vote dominates (maximally conservative); raise
  # (e.g. 0.2-0.4) so isolated misclassified voxels cannot poison a cell —
  # mainly useful when grid_cell_size > vox_size.
  obstacle_min_frac: 0.5
  # Shared frontier frame (must match the high-flying drone's mission
  # config); bounds below are in this frame and replace xmin/xmax/ymin/ymax.
  ff_origin_lat: 40.413131
  ff_origin_lon: -79.946393
  ff_origin_alt: 220.80565047594274
  ff_heading_deg: -76.17
  ff_map_min_x: -34.86
  ff_map_max_x: 34.33
  ff_map_min_y: -20.09
  ff_map_max_y: 7.82
  # No-fly zone for the starlings (surveyed corners, see
  # ./bound_coordinates) — the counterpart of the high-flyer's "zone 2".
  # In frame coords it spans x [-24.4, 0.6], y [-30.9, -10.8], so the part
  # overlapping our map box (y >= -20.09) is excluded from exploration.
  keepout_polygons:
    - - [40.41306, -79.94674]
      - [40.41312, -79.94652]
      - [40.41332, -79.94659]
      - [40.41326, -79.94681]
  # Per-robot georeference of the local NED odometry: FILL PER TAKEOFF.
  # The ned_origins entry matching this run's robot_id wins (the flat
  # ned_origin_* keys in default.yaml remain as a single-robot fallback).
  #   lat/lon/alt: WGS84 position of the odometry origin (where the drone
  #     sat when odometry initialized).
  #   heading_deg: compass azimuth in degrees CLOCKWISE FROM TRUE NORTH of
  #     the local NED +x axis (the direction the drone faced at init).
  # NOTE the convention differs from ff_heading_deg, which is degrees CCW
  # FROM EAST (the high-flyer's convention). Do NOT copy ff_heading_deg
  # here: facing along the frame's X axis at init means
  # heading_deg = 90 - ff_heading_deg. The frames always relate as
  # frame_x = ned_x, frame_y = -ned_y when aligned (NED is z-down with +y
  # right of +x; the frontier frame is ENU z-up with +Y left of +X).
  # With no usable entry, the planner warns and falls back to the local
  # xmin/xmax/ymin/ymax bounds below.
  ned_origins:
    robot2:
      lat: 40.41329
      lon: -79.94657
      alt: 0.0
      heading_deg: 166.17  # = 90 - ff_heading_deg = 90 - (-76.17)
    robot3:
      lat: 40.41332        # FILL: robot_3's own takeoff spot + heading
      lon: -79.94648       # (currently copies robot2's values)
      alt: 0.0
      heading_deg: 166.17
  # Local-frame fallback bounds (pose frame), used only when the frontier
  # frame is not fully configured.
  xmin: -100.0
  xmax: 100.0
  ymin: -100.0
  ymax: 100.0

  region_time_budget_s: 180