# Configuration for semantic segmentation evaluation on ROS2 Isaac Sim dataset
# Uses NA-Radio encoder with ROS2 semantic segmentation data

defaults:
  - default
  - override dataset: ros2isaacsim_eval
  - override encoder: naradio
  - override mapping: semantic_voxel_map
  - override vis: rerun
  - _self_

# Choose any suitable folder for saving the results
eval_out: eval_out/ros2isaacsim

# Evaluation parameters
load_external_gt: false
prediction_thresh: 0.1
prompt_denoising_thresh: 0.5
k: 0  # 1-to-1 mapping for ROS2 data
classes_to_ignore: []
classes_to_eval: []

# Dataset configuration
# Note: scene_name is not needed for ROS2SemSegSubscriber
dataset:
  scene_name: "isaac_sim_robot5"
  rgb_resolution: [480, 640]
  depth_resolution: [480, 640]
  frame_skip: 1

# Mapping configuration
mapping:
  vox_size: 0.05 #5cm voxels
  vox_accum_period: 4
  max_pts_per_frame: -1

# Encoder configuration
encoder:
  model_version: radio_v2.5-l
  lang_model: siglip

# Querying configuration
querying:
  _target_: rayfronts.querying.naradio.NARadioQuerying
  text_query_mode: "labels"  # Use "labels" or "prompts"
  compressed: false

