# Visualization configuration
# vis:
#   _target_: rayfronts.visualizers.rerun.RerunVisualizer
#   port: 9090
#   pose_period: 10
#   input_period: 10
#   map_period: 50

# Training configuration
seed: 42
batch_size: 1
depth_limit: 10  # No depth limit

# Evaluation period (frames between evaluations)
# eval_period: 100
