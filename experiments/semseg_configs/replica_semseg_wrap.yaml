defaults:
  - default
  - override dataset: semnerf_replica  # Make sure to include semseg_info
  - override encoder: semseg_wrap
  - override mapping: semantic_voxel_map
  - override vis: rerun # Set to null to disable vis
  - _self_

# Choose any suitable folder for saving the results
eval_out: eval_out/semseg_wrap_replica

load_external_gt: False # Whether to load external ground truth semseg labels for evaluation
prediction_thresh: 0.1 # Threshold after which a prediction is made.
prompt_denoising_thresh: 0.5 # Confidence threshold below which the target class prompt is removed
k: 5 # K nearest neighbor value for aligning voxels. Set to 0 to impose a 1-to-1 mapping (0 distance)

open_vocab_classes:
  - soil
  - excavator
  - human
  - beam
  - ceiling
  - pipe
  - wall
  - box
  - column

export_class_plys: true

# For running the script on multiple scenes at the same time.
hydra:
  sweeper:
    params:
      dataset.scene_name: office0,office1,office2,office3,office4,room0,room1,room2

dataset:
  path: /workspace/RayFronts/Dataset
  scene_name: env_1
  rgb_resolution: [1024, 1024]
  depth_resolution: [1024, 1024]
  frame_skip: 0
  load_semseg: False

encoder:
  encoder:
    model_version: c-radio_v3-b
    lang_model: siglip2
  classes: ${open_vocab_classes}
  
mapping:
  vox_size: 0.02 # 5cm voxels
  vox_accum_period: 4
  max_pts_per_frame: 10000

querying:
  text_query_mode: "labels"
  query_file: '/workspace/RayFronts/test.txt'
  auto_generate_query_file: true
  